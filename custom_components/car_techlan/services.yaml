trigger_plate:
  name: Симулировать распознавание
  description: Запустить обработку номера вручную (для тестов и автоматизаций).
  fields:
    plate:
      name: Номер
      description: Номер автомобиля
      required: true
      example: "А123ВС125"
      selector:
        text:
    camera:
      name: Камера
      description: Имя камеры (по умолчанию manual)
      example: "Post5"
      selector:
        text:
    known:
      name: Свой
      description: Считать номер своим (иначе определяется по справочнику)
      selector:
        boolean:
    owner:
      name: Владелец
      description: Владелец (для уведомлений)
      selector:
        text:

server_checks:
  name: Проверки сервера
  description: Запустить диагностику Car-Techlan-Server и вернуть результат в события.
  fields:
    host:
      name: Хост сервера
      selector:
        text:
    port:
      name: Порт
      selector:
        number:
          min: 1
          max: 65535
server_incidents:
  name: Инциденты сервера
  description: Получить последние инциденты (WARN/ERROR/ALERT).
server_restart_web:
  name: Перезапустить веб-панель
  description: Перезагрузить веб-слой сервера (панель перестанет отвечать на несколько секунд).
server_restart_service:
  name: Перезапустить службу распознавания
  description: Перезапустить задачу ALPR-Service (распознавание прервётся на несколько секунд).
server_clear_tts_cache:
  name: Очистить кэш TTS
  description: Удалить озвучку старше N дней.
  fields:
    days:
      name: Дней
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: дн
server_camera_restart:
  name: Перезапустить поток камеры
  description: Переподключить камеру на сервере.
  fields:
    camera:
      name: Камера
      description: Имя камеры (например Post5)
      required: true
      selector:
        text:

set_camera_action:
  name: Действие для камеры
  description: Задать действие и устройства для конкретной камеры (приоритет над общими настройками). Сохраняется в опциях интеграции.
  fields:
    camera:
      name: Камера
      description: Имя камеры как в сервере (Post5, Post3, Post2…)
      required: true
      selector:
        text:
    action:
      name: Действие (любой номер)
      selector:
        select:
          options: [open, close, toggle, turn_on, turn_off, impulse, none]
    action_known:
      name: Действие для СВОЕГО номера
      selector:
        select:
          options: [open, close, toggle, turn_on, turn_off, impulse, none]
    action_unknown:
      name: Действие для ЧУЖОГО номера
      selector:
        select:
          options: [open, close, toggle, turn_on, turn_off, impulse, none]
    devices:
      name: Устройства (entity_id)
      selector:
        entity:
          multiple: true
    cooldown:
      name: Пауза, с
      selector:
        number:
          min: 0
          max: 3600
    hold_seconds:
      name: Импульс, с
      selector:
        number:
          min: 0.2
          max: 60
          step: 0.1
